name: Trained model
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch pytest --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m pytest tests/ -q
      - run: python -m neural_fabric train-demo --output artifacts/demo-model.pt --epochs 2
      - run: python -m neural_fabric predict --model artifacts/demo-model.pt --input examples/sample.json
      - run: python -m neural_fabric evaluate --model artifacts/demo-model.pt --mode top1
